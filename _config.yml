title: "Crochet for Beginners"
logo: "/assets/images/the-kit-wit-logo-wide.png"
email:
description: "Simple crochet lessons for beginners by The Kit Wit."
minimal_mistakes_skin: default
search: true

markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name: "The Kit Wit"
  avatar: "/assets/images/the-kit-wit-avatar-small.png"
  bio: "Simple crochet lessons, tips, and ideas for beginners."
  links:
    - label: "Join my WhatsApp channel"
      icon: "fab fa-fw fa-whatsapp"
      url: "https://whatsapp.com/channel/0029VbDsX5SH5JLvxKh5VX0a"

footer:
  links:
    - label: "Join my WhatsApp channel"
      icon: "fab fa-fw fa-whatsapp"
      url: "https://whatsapp.com/channel/0029VbDsX5SH5JLvxKh5VX0a"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
